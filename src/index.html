<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Neon Planner</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="planner.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="brand"><span class="brand-top">NEON</span><span class="brand-bottom">PLANNER</span><span class="brand-sub">DAILY OPS</span></div>
      <button class="nav" data-view="day"><span class="ico">◉</span>Today</button>
      <button class="nav" data-view="week"><span class="ico">▤</span>Next 7 Days</button>
      <button class="nav" data-view="meals"><span class="ico">◍</span>Meals</button>
      <button class="nav" data-view="month"><span class="ico">▦</span>Calendar</button>
      <button class="nav" data-view="settings"><span class="ico">⚙</span>Settings</button>
      <div class="side-foot"><div id="clock"></div><span id="saveState">Saved</span></div>
    </nav>
    <main>
      <header id="topbar"><div id="campaignName"></div><div class="hint" id="nextUp"></div></header>
      <div id="view"></div>
    </main>
  </div>
  <div id="modal" class="hidden"><div class="modal-box"></div></div>
  <div id="toast" class="hidden"></div>
  <script src="app.js"></script>
  <script src="meals.js"></script>
</body>
</html>
